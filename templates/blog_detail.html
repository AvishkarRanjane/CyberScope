<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ meta.title }} - CyberScope</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<nav class="navbar"><div class="nav-container"><div class="logo"><i class="fas fa-shield-alt"></i><span>CyberScope</span></div></div></nav>
<main style="max-width:900px;margin:40px auto;padding:20px;background:#1b2430;border-radius:8px;color:var(--text-light)">
    <img src="{{ url_for('static', filename=meta.image) }}" alt="{{ meta.title }}" style="width:100%;height:auto;border-radius:6px;margin-bottom:16px;">
    <h1>{{ meta.title }}</h1>
    <p>{{ meta.description }}</p>
    <a href="https://www.google.com/search?q={{ meta.title | replace(' ','+') }}" target="_blank" rel="noopener" class="btn btn-primary">Read More Sources</a>
</main>
</body>
</html>
